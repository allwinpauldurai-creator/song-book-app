org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# API origins baked into each build flavour (no trailing slash). Override per build with
#   ./gradlew assembleProdRelease -Psongbook.apiBaseUrl.prod=https://api.example.org
# CI passes the same API_ORIGIN variable the web app's deploy workflow uses.
# 10.0.2.2 is the host machine as seen from the Android emulator (local Spring Boot on :8080).
songbook.apiBaseUrl.local=http://10.0.2.2:8080
songbook.apiBaseUrl.dev=https://app-songbook-dev-eys56l.azurewebsites.net
songbook.apiBaseUrl.prod=https://api.songbook.example.org
