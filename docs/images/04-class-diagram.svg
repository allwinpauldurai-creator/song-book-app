xt x="292" y="192" fill="#1f1e1b">onSignedIn(), deleteAll()</text><text x="292" y="208" fill="#1f1e1b">OFFLINE_GRACE_DAYS = 30</text></g><g><g><rect x="280" y="264" width="208" height="72" rx="8" fill="#efeee9" stroke="#9c9a92" stroke-width="1.25"></rect><line x1="280" x2="488" y1="296" y2="296" stroke="#d8d6ce"></line></g><text x="292" y="288" font-size="13" font-weight="600" fill="#1f1e1b">OfflineIndex</text><text x="292" y="312" fill="#1f1e1b">ownerUserId</text><text x="292" y="328" fill="#1f1e1b">books: List of OfflineBook</text></g><g><g><rect x="280" y="384" width="208" height="136" rx="8" fill="#efeee9" stroke="#9c9a92" stroke-width="1.25"></rect><line x1="280" x2="488" y1="416" y2="416" stroke="#d8d6ce"></line></g><text x="292" y="408" font-size="13" font-weight="600" fill="#1f1e1b">OfflineBook</text><text x="292" y="432" fill="#1f1e1b">bookId, title</text><text x="292" y="448" fill="#1f1e1b">versionId, versionNumber</text><text x="292" y="464" fill="#1f1e1b">sizeBytes, pageCount</text><text x="292" y="480" fill="#1f1e1b">downloadedAt, verifiedAt</text><text x="292" y="496" fill="#1f1e1b">lastPage, updateAvailable</text><text x="292" y="512" fill="#1f1e1b">verifiedRecently()</text></g><g><g><rect x="520" y="64" width="208" height="120" rx="8" fill="none" stroke="#9c9a92" stroke-width="1.25"></rect><line x1="520" x2="728" y1="96" y2="96" stroke="#d8d6ce"></line></g><text x="532" y="88" font-size="13" font-weight="600" fill="#1f1e1b">PdfRepository</text><text x="532" y="112" fill="#1f1e1b">openForReading(bookId)</text><text x="532" y="128" fill="#1f1e1b">download(bookId, uri)</text><text x="532" y="144" fill="#1f1e1b">fetch(ticket, out)</text><text x="532" y="160" fill="#1f1e1b">clearCache()</text><text x="532" y="176" fill="#1f1e1b">cache: books/, one PDF</text></g><g><g><rect x="520" y="264" width="208" height="104" rx="8" fill="#efeee9" stroke="#9c9a92" stroke-width="1.25"></rect><line x1="520" x2="728" y1="296" y2="296" stroke="#d8d6ce"></line></g><text x=