<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 600" role="img" aria-label="A downloaded book opens offline for 30 days after its last server check" font-size="13"><rect width="760" height="600" fill="#ffffff"/><defs><marker id="open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c9a92"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#1f1e1b">A downloaded book opens offline for 30 days after its last server check</text><g fill="none" stroke="#9c9a92" stroke-width="1.25"><path d="M200 96H234" marker-end="url(#open-arrow)"></path><path d="M426 96H480" marker-end="url(#open-arrow)"></path><path d="M330 128V152" marker-end="url(#open-arrow)"></path><path d="M426 184H480" marker-end="url(#open-arrow)"></path><path d="M330 216V240" marker-end="url(#open-arrow)"></path><path d="M426 272H480" marker-end="url(#open-arrow)"></path><path d="M330 304V328" marker-end="url(#open-arrow)"></path><path d="M426 360H480" marker-end="url(#open-arrow)"></path><path d="M330 392V420" marker-end="url(#open-arrow)"></path><path d="M330 476V496H130V520" marker-end="url(#open-arrow)"></path><path d="M330 476V520" marker-end="url(#open-arrow)"></path><path d="M330 496H530V520" marker-end="url(#open-arrow)"></path></g><g><rect x="24" y="68" width="176" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9c9a92" stroke-width="1.25"></rect><text x="112" y="92" text-anchor="middle" font-weight="600" fill="#1f1e1b">Reader opens</text><text x="112" y="110" text-anchor="middle" font-size="11.5" fill="#5f5d57">ReaderViewModel.open()</text></g><g><polygon points="234,96 330,64 426,96 330,128" fill="none" stroke="#9c9a92" stroke-width="1.25"></polygon><text x="330" y="100" text-anchor="middle" fill="#1f1e1b">Downloaded copy?</text></g><g><rect x="480" y="68" width="240" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9c9a92" stroke-width="1.25"></rect><text x="600" y="92" text-anchor="middle" font-weight="600" fill="#1f1e1b">Open online</text><text x="600" y="110" text-anchor="middle" font-size="11.5" fill="#5f5d57">read ticket, cache PDF, render</text></g><g><polygon points="234,184 330,152 426,184 330,216" fill="none" stroke="#9c9a92" stroke-width="1.25"></polygon><text x="330" y="188" text-anchor="middle" font-size="11.5" fill="#1f1e1b">Logged out or no access?</text></g><g><rect x="480" y="156" width="240" height="56" rx="8" fill="#d14343" fill-opacity="0.12" stroke="#d14343" stroke-width="2"></rect><text x="600" y="180" text-anchor="middle" font-weight="600" fill="#1f1e1b">Blocked</text><text x="600" y="198" text-anchor="middle" font-size="11.5" fill="#1f1e1b">log in again or renew membership</text></g><g><polygon points="234,272 330,240 426,272 330,304" fill="none" stroke="#9c9a92" stroke-width="1.25"></polygon><text x="330" y="276" text-anchor="middle" fill="#1f1e1b">Checked in 30 days?</text></g><g><rect x="480" y="244" width="240" height="56" rx="8" fill="#2f6fdb" fill-opacity="0.12" stroke="#2f6fdb" stroke-width="2"></rect><text x="600" y="268" text-anchor="middle" font-weight="600" fill="#1f1e1b">Open from the phone</text><text x="600" y="286" text-anchor="middle" font-size="11.5" fill="#1f1e1b">re-check in background if online</text></g><g><polygon points="234,360 330,328 426,360 330,392" fill="none" stroke="#9c9a92" stroke-width="1.25"></polygon><text x="330" y="364" text-anchor="middle" fill="#1f1e1b">Online?</text></g><g><rect x="480" y="332" width="240" height="56" rx="8" fill="#d14343" fill-opacity="0.12" stroke="#d14343" stroke-width="2"></rect><text x="600" y="356" text-anchor="middle" font-weight="600" fill="#1f1e1b">Blocked</text><text x="600" y="374" text-anchor="middle" font-size="11.5" fill="#1f1e1b">connect once to keep reading</text></g><g><rect x="234" y="420" width="192" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9c9a92" stroke-width="1.25"></rect><text x="330" y="444" text-anchor="middle" font-weight="600" fill="#1f1e1b">Re-check access</text><text x="330" y="462" text-anchor="middle" font-size="11.5" fill="#5f5d57">GET books/:id/read-access</text></g><g><rect x="38" y="520" width="184" height="56" rx="8" fill="#2f6fdb" fill-opacity="0.12" stroke="#2f6fdb" stroke-width="2"></rect><text x="130" y="544" text-anchor="middle" font-weight="600" fill="#1f1e1b">200: open copy</text><text x="130" y="562" text-anchor="middle" font-size="11.5" fill="#1f1e1b">mark verified, flag update</text></g><g><rect x="238" y="520" width="184" height="56" rx="8" fill="#d14343" fill-opacity="0.12" stroke="#d14343" stroke-width="2"></rect><text x="330" y="544" text-anchor="middle" font-weight="600" fill="#1f1e1b">403: blocked</text><text x="330" y="562" text-anchor="middle" font-size="11.5" fill="#1f1e1b">membership not valid</text></g><g><rect x="438" y="520" width="184" height="56" rx="8" fill="#d14343" fill-opacity="0.12" stroke="#d14343" stroke-width="2"></rect><text x="530" y="544" text-anchor="middle" font-weight="600" fill="#1f1e1b">404: copy deleted</text><text x="530" y="562" text-anchor="middle" font-size="11.5" fill="#1f1e1b">book withdrawn</text></g><text x="453" y="88" text-anchor="middle" font-size="11.5" fill="#5f5d57">no</text><text x="338" y="144" font-size="11.5" fill="#5f5d57">yes</text><text x="453" y="176" text-anchor="middle" font-size="11.5" fill="#5f5d57">yes</text><text x="338" y="232" font-size="11.5" fill="#5f5d57">no</text><text x="453" y="264" text-anchor="middle" font-size="11.5" fill="#5f5d57">yes</text><text x="338" y="320" font-size="11.5" fill="#5f5d57">no</text><text x="453" y="352" text-anchor="middle" font-size="11.5" fill="#5f5d57">no</text><text x="338" y="410" font-size="11.5" fill="#5f5d57">yes</text></svg>
