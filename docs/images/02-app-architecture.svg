<svg xmlns="http://www.w3.org/2000/svg" width="760" height="584" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 584" role="img" aria-label="Four layers, all wired by hand in one AppContainer" font-size="13"><rect width="760" height="584" fill="#ffffff"/><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c9a92"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#1f1e1b">Four layers, all wired by hand in one AppContainer</text><g><rect x="24" y="64" width="120" height="496" rx="8" fill="#2f6fdb" fill-opacity="0.12" stroke="#2f6fdb" stroke-width="2"></rect><text x="84" y="88" text-anchor="middle" font-weight="600" fill="#1f1e1b">AppContainer</text><text x="84" y="108" text-anchor="middle" font-size="11.5" fill="#1f1e1b">manual DI</text><text x="84" y="126" text-anchor="middle" font-size="11.5" fill="#5f5d57">builds each shared</text><text x="84" y="142" text-anchor="middle" font-size="11.5" fill="#5f5d57">object once per</text><text x="84" y="158" text-anchor="middle" font-size="11.5" fill="#5f5d57">process</text></g><g><rect x="160" y="64" width="576" height="112" rx="8" fill="#efeee9" stroke="#9c9a92" stroke-width="1.25"></rect><text x="176" y="88" font-weight="600" fill="#1f1e1b">UI: Jetpack Compose, Material 3</text><rect x="176" y="104" width="127" height="56" rx="8" fill="#ffffff" stroke="#9c9a92" stroke-width="1.25"></rect><rect x="315" y="104" width="127" height="56" rx="8" fill="#ffffff" stroke="#9c9a92" stroke-width="1.25"></rect><rect x="454" y="104" width="127" height="56" rx="8" fill="#ffffff" stroke="#9c9a92" stroke-width="1.25"></rect><rect x="593" y="104" width="127" height="56" rx="8" fill="#ffffff" stroke="#9c9a92" stroke-width="1.25"></rect><text x="239.5" y="128" text-anchor="middle" font-weight="600" fill="#1f1e1b">SongBookApp</text><text x="239.5" y="146" text-anchor="middle" font-size="11.5" fill="#5f5d57">NavHost, tabs</text><text x="378.5" y="128" text-anchor="middle" font-weight="600" fill="#1f1e1b">Member</text><text x="378.5" y="146" text-anchor="middle" font-size="11.5" fill="#5f5d57">books, reader, me</text><text x="517.5" y="128" text-anchor="middle" font-weight="600" fill="#1f1e1b">Auth</text><text x="517.5" y="146" text-anchor="middle" font-size="11.5" fill="#5f5d57">login, register</text><text x="656.5" y="128" text-anchor="middle" font-weight="600" fill="#1f1e1b">Manage</text><text x="656.5" y="146" text-anchor="middle" font-size="11.5" fill="#5f5d57">admin, publisher</text></g><g><rect x="160" y="200" width="576" height="56" rx="8" fill="none" stroke="#9c9a92" stroke-width="1.25"></rect><text x="448" y="224" text-anchor="middle" font-weight="600" fill="#1f1e1b">ViewModels (20, one per screen)</text><text x="448" y="242" text-anchor="middle" font-size="11.5" fill="#5f5d57">StateFlow UI state, coroutines in viewModelScope</text></g><g><rect x="160" y="280" width="576" height="128" rx="8" fill="#efeee9" stroke="#9c9a92" stroke-width="1.25"></rect><text x="176" y="304" font-weight="600" fill="#1f1e1b">Data layer</text><rect x="176" y="320" width="127" height="72" rx="8" fill="#ffffff" stroke="#9c9a92" stroke-width="1.25"></rect><rect x="315" y="320" width="127" height="72" rx="8" fill="#ffffff" stroke="#9c9a92" stroke-width="1.25"></rect><rect x="454" y="320" width="127" height="72" rx="8" fill="#ffffff" stroke="#9c9a92" stroke-width="1.25"></rect><rect x="593" y="320" width="127" height="72" rx="8" fill="#ffffff" stroke="#9c9a92" stroke-width="1.25"></rect><text x="239.5" y="344" text-anchor="middle" font-weight="600" fill="#1f1e1b">Retrofit APIs</text><text x="239.5" y="362" text-anchor="middle" font-size="11.5" fill="#5f5d57">SongBookApi</text><text x="239.5" y="378" text-anchor="middle" font-size="11.5" fill="#5f5d57">AdminApi</text><text x="378.5" y="344" text-anchor="middle" font-weight="600" fill="#1f1e1b">SessionManager</text><text x="378.5" y="362" text-anchor="middle" font-size="11.5" fill="#5f5d57">token, refresh</text><text x="378.5" y="378" text-anchor="middle" font-size="11.5" fill="#5f5d57">session state</text><text x="517.5" y="344" text-anchor="middle" font-weight="600" fill="#1f1e1b">PdfRepository</text><text x="517.5" y="362" text-anchor="middle" font-size="11.5" fill="#5f5d57">read tickets</text><text x="517.5" y="378" text-anchor="middle" font-size="11.5" fill="#5f5d57">PDF streaming</text><text x="656.5" y="344" text-anchor="middle" font-weight="600" fill="#1f1e1b">OfflineLibrary</text><text x="656.5" y="362" text-anchor="middle" font-size="11.5" fill="#5f5d57">downloads</text><text x="656.5" y="378" text-anchor="middle" font-size="11.5" fill="#5f5d57">30-day re-check</text></g><g><rect x="160" y="432" width="576" height="128" rx="8" fill="#efeee9" stroke="#9c9a92" stroke-width="1.25"></rect><text x="176" y="544" font-weight="600" fill="#1f1e1b">Device and network</text><rect x="176" y="448" width="127" height="72" rx="8" fill="#ffffff" stroke="#9c9a92" stroke-width="1.25"></rect><rect x="315" y="448" width="127" height="72" rx="8" fill="#ffffff" stroke="#9c9a92" stroke-width="1.25"></rect><rect x="454" y="448" width="127" height="72" rx="8" fill="#ffffff" stroke="#9c9a92" stroke-width="1.25"></rect><rect x="593" y="448" width="127" height="72" rx="8" fill="#ffffff" stroke="#9c9a92" stroke-width="1.25"></rect><text x="239.5" y="472" text-anchor="middle" font-weight="600" fill="#1f1e1b">OkHttp client</text><text x="239.5" y="490" text-anchor="middle" font-size="11.5" fill="#5f5d57">auth interceptor</text><text x="239.5" y="506" text-anchor="middle" font-size="11.5" fill="#5f5d57">cookie jar</text><text x="378.5" y="472" text-anchor="middle" font-weight="600" fill="#1f1e1b">Private prefs</text><text x="378.5" y="490" text-anchor="middle" font-size="11.5" fill="#5f5d57">refresh cookie</text><text x="378.5" y="506" text-anchor="middle" font-size="11.5" fill="#5f5d57">last user</text><text x="517.5" y="472" text-anchor="middle" font-weight="600" fill="#1f1e1b">Cache dir</text><text x="517.5" y="490" text-anchor="middle" font-size="11.5" fill="#5f5d57">books/</text><text x="517.5" y="506" text-anchor="middle" font-size="11.5" fill="#5f5d57">one PDF at a time</text><text x="656.5" y="472" text-anchor="middle" font-weight="600" fill="#1f1e1b">Files dir</text><text x="656.5" y="490" text-anchor="middle" font-size="11.5" fill="#5f5d57">offline PDFs</text><text x="656.5" y="506" text-anchor="middle" font-size="11.5" fill="#5f5d57">covers, index.json</text></g><g fill="none" stroke="#9c9a92" stroke-width="1.25"><path d="M448 176V200" marker-end="url(#arch-arrow)"></path><path d="M448 256V280" marker-end="url(#arch-arrow)"></path><path d="M239.5 392V448" marker-end="url(#arch-arrow)"></path><path d="M378.5 392V448" marker-end="url(#arch-arrow)"></path><path d="M517.5 392V448" marker-end="url(#arch-arrow)"></path><path d="M656.5 392V448" marker-end="url(#arch-arrow)"></path></g></svg>
