# Builds a signed release for one environment and publishes it to that environment's Azure storage.
#
# GitHub environment ("dev" / "prod") variables:
#   API_ORIGIN                 same value as the web deploy, e.g. https://api.songbook.example.org
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   OIDC app registration (federated credential for this repo)
#   RELEASES_STORAGE_ACCOUNT   output storageAccountName of infra/releases.bicep
# Repository secrets (one upload key for every environment; see README "Signing key"):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android release

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      flavour:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    env:
      FLAVOUR: ${{ inputs.flavour }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Check configuration
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          [[ "$API_ORIGIN" =~ ^https://[a-zA-Z0-9.-]+$ ]] || { echo "::error::Set the API_ORIGIN variable (https://..., no trailing slash) on the '${{ inputs.environment }}' environment"; exit 1; }
          [[ "$HAS_KEYSTORE" == "true" ]] || { echo "::error::Add the ANDROID_KEYSTORE_* repository secrets (README, Signing key)"; exit 1; }

      - name: Build signed APK and App Bundle
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          SONGBOOK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SONGBOOK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SONGBOOK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export SONGBOOK_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$SONGBOOK_KEYSTORE_FILE"
          cap="${FLAVOUR^}"
          chmod +x gradlew
          ./gradlew --no-daemon ":app:assemble${cap}Release" ":app:bundle${cap}Release" \
            "-Psongbook.apiBaseUrl.${FLAVOUR}=${API_ORIGIN}" -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
          rm -f "$SONGBOOK_KEYSTORE_FILE"
          mkdir -p dist
          cp "app/build/outputs/apk/${FLAVOUR}/release/app-${FLAVOUR}-release.apk" "dist/songbook-${FLAVOUR}-${VERSION_NAME}.apk"
          cp "app/build/outputs/bundle/${FLAVOUR}Release/app-${FLAVOUR}-release.aab" "dist/songbook-${FLAVOUR}-${VERSION_NAME}.aab"
          cat > dist/latest.json <<EOF
          {"versionCode": ${VERSION_CODE}, "versionName": "${VERSION_NAME}", "apk": "songbook-${FLAVOUR}-${VERSION_NAME}.apk", "commit": "${GITHUB_SHA}"}
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.flavour }}
          path: dist
          retention-days: 90

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish APK to Azure Blob Storage
        env:
          ACCOUNT: ${{ vars.RELEASES_STORAGE_ACCOUNT }}
        run: |
          upload() { # <file> <blob name> <content type> <cache control>
            az storage blob upload --auth-mode login --account-name "$ACCOUNT" --container-name releases \
              --file "$1" --name "$2" --content-type "$3" --content-cache-control "$4" --overwrite --only-show-errors
          }
          apk="dist/songbook-${FLAVOUR}-${VERSION_NAME}.apk"
          upload "$apk" "${FLAVOUR}/songbook-${FLAVOUR}-${VERSION_NAME}.apk" application/vnd.android.package-archive "public, max-age=31536000, immutable"
          upload "$apk" "${FLAVOUR}/songbook-${FLAVOUR}-latest.apk" application/vnd.android.package-archive "no-cache"
          upload dist/latest.json "${FLAVOUR}/latest.json" application/json "no-cache"
          url=$(az storage account show --name "$ACCOUNT" --query primaryEndpoints.blob -o tsv)
          echo "### Android ${FLAVOUR} ${VERSION_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "Download: ${url}releases/${FLAVOUR}/songbook-${FLAVOUR}-latest.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the API this build points at
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: |
          curl -fsS "$API_ORIGIN/actuator/health" | grep -q '"UP"'
          curl -fsS "$API_ORIGIN/api/v1/categories" > /dev/null
